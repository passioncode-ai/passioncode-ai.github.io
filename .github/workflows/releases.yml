name: Release drift

# Nightly, inside the organization's 23:00 Europe/Warsaw window (CI policy of 2026-09-25).
# The live site is already current: the Worker writes versions at the edge
# (docs/DEPLOYMENT.md#always-current-versions). This job keeps the sources equal to it, so a
# crawler of the repository and the next deploy carry the same versions.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the sources against the published releases
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run releases:check
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 current · 2 current, a product did not answer · 3 drift · anything else an error
          if [ "$code" = 2 ]; then echo "::warning::a product did not answer; its last version was kept"; fi
          case "$code" in 0|2|3) exit 0 ;; *) echo "::error::releases:check failed ($code)"; exit "$code" ;; esac
      - name: Sync and propose
        if: steps.check.outputs.code == '3'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run releases:sync
          python3 scripts/extract-public-copy.py
          npm run check
          # One automation branch, rewritten each night from main; one open pull request at most.
          branch="automation/release-sync"
          git config user.name "passioncode-ai release sync"
          git config user.email "contact@passioncode.ai"
          git checkout -B "$branch"
          git add -A
          git commit -m "Sync pages to the published releases"
          git push --force -u origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The open pull request from $branch now carries tonight's sync."
          elif ! gh pr create --title "Sync pages to the published releases" --body "Nightly \`npm run releases:sync\`; \`npm run check\` passed in the job. The live site already shows these versions (edge rewrite); this keeps the sources equal. docs/DEPLOYMENT.md#always-current-versions"; then
            # The organization does not let Actions open pull requests (measured 2026-10-06:
            # "GitHub Actions is not permitted to create or approve pull requests"). The live site is
            # unaffected (the Worker rewrites versions at the edge), so the job does not fail every
            # night; it keeps ONE open issue pointing at the synced branch until a person opens it.
            title="Release drift: sources behind the published releases"
            compare="https://github.com/${{ github.repository }}/compare/main...$branch"
            body="The nightly job synced the sources on \`$branch\` (\`npm run check\` passed) but cannot open the pull request itself. Open it: $compare — run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The live site already serves the current versions. docs/DEPLOYMENT.md#always-current-versions"
            issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            echo "::warning::Drift synced on $branch; Actions may not open pull requests here, so issue \"$title\" tracks it: $compare"
          fi
