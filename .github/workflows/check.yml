name: Check public site

on:
  pull_request:
  push:
    branches: [main]
  # The nightly release sync (releases.yml) dispatches this on its branch: a pull request opened
  # with the Actions token starts no workflow, so without it that pull request carries no check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
